controller:
  # 1. CRITICAL FOR F5: Installs required underlying Custom Resource Definitions
  enableCustomResources: true

  service:
    # 2. Tell the external service listeners to switch on (Defaults to true)
    httpPort:
      enable: true
      port: 80
    httpsPort:
      enable: true
      port: 443

    # 3. FIXES THE 400 CONFLICT: Maps AWS NLB 443 traffic straight to NGINX Container Port 80 (HTTP)
    # The default value is 443. Changing it to 80 resolves the protocol mismatch.
    targetHttpsPort: 80

    # 4. Valid AWS NLB Config
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:041445559784:certificate/cd81e3b4-95e7-44dc-b496-b88a8acabd93"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"







